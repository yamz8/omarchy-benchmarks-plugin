name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Check the manifest and strings are valid JSON
        run: jq -e . manifest.json i18n/*.json > /dev/null
      - name: Run the model tests
        run: node --test tests/
